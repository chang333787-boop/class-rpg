# 우리반 성장 RPG — PR · main 자동 검사 (CI-CHECK-1)
#  ⚠️ 아직 꺼져 있다: GitHub 은 이 파일이 `.github/workflows/check.yml` 에 있어야 돌린다.
#     세션 토큰에 `workflow` 권한이 없어 거기로 못 올렸다(2026-10-04 push 거절). 켜려면 사용자가 한 번:
#       mkdir -p .github/workflows && git mv scripts/ci/check.yml .github/workflows/check.yml
#     → 커밋 → push (workflow 권한이 있는 계정 · 또는 GitHub 웹에서 이 내용으로 새 파일 만들기).
#  · 브라우저가 필요 없는 검사만 돈다(꾸미기 하네스 · 골드 실SDK 는 빠짐 → 로컬 `precheck.mjs --deco/--gold`).
#  · 비밀값 없음 · 운영 Firebase 통신 없음(모든 검사가 node 기본 모듈 + git 읽기 + 127.0.0.1 로컬 서버).
#  · 판정만 보여 준다. 브랜치 보호(머지 막기)는 걸지 않았다.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # buster-check · balance-identity 가 origin/main 과 비교한다

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: verify-safety
        run: node scripts/verify-safety.mjs

      - name: smoke-test
        run: node scripts/smoke-test.mjs

      - name: precheck (--no-deco)
        run: node scripts/unit/precheck.mjs --no-deco --base origin/main

      - name: 하위 앱 시험
        shell: bash
        run: |
          for f in $(find scripts/unit -name '*.test.mjs' | sort); do
            echo "== $f"
            node "$f" | tail -1
          done
