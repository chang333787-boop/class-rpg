<!-- d_y55_happy 닭 · 부위 나눈 그림 · 키 .85칸(칸의 .95배 · 지금 .72) · 쓰다듬으면 — 폴짝 · 날개 파닥(0.9s 한 번 돌고 코드가 idle 로) -->
<defs><style>.o{stroke:#2b2118;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.i{stroke:#2b2118;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}.p{transform-box:fill-box}.up{animation:jp .9s ease-out 1}@keyframes jp{0%{transform:translateY(0)}25%{transform:translateY(-14px)}50%{transform:translateY(0)}65%{transform:translateY(-5px)}80%,100%{transform:translateY(0)}}.wing{transform-origin:10% 20%;animation:fl .15s ease-in-out 6 alternate}@keyframes fl{to{transform:rotate(-38deg)}}.head{transform-origin:15% 90%;transform:rotate(-12deg)}.legL,.legR{transform-origin:50% 0;animation:tuck .9s ease-out 1}@keyframes tuck{25%{transform:rotate(-30deg)}50%{transform:rotate(0)}}.lid{display:none}</style></defs>
