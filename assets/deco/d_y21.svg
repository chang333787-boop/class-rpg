<svg width="100" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 400">
<!-- d_y21 장미 아치 1×3 (세로 통로) · footprint y100~400 · 앞쪽 아치가 크고 뒤쪽 아치가 작아 깊이 -->
<defs><style>.o{stroke:#2b2118;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.i{stroke:#2b2118;stroke-width:1.8;stroke-linejoin:round}</style>
<g id="rose"><circle r="6" fill="#c92f3a" stroke="#2b2118" stroke-width="1.6"/><circle cx="-1.5" cy="-1.5" r="2.4" fill="#e8636d"/><circle cx="1" cy="1" r="1" fill="#7a1a22"/></g>
<g id="leaf"><ellipse rx="5" ry="3" fill="#4f7a2e" stroke="#2b2118" stroke-width="1.2"/><path d="M-4,0 h8" stroke="#86ad50" stroke-width="1"/></g>
</defs>
<!-- 바닥 흙길 (통로) -->
<path d="M26,120 L74,120 L80,392 L20,392 Z" fill="#8a6a45" opacity=".9"/>
<path d="M32,126 L68,126 L72,386 L28,386 Z" fill="#a8845a"/>
<g fill="#c9a577"><ellipse cx="40" cy="200" rx="3" ry="2"/><ellipse cx="60" cy="260" rx="2.5" ry="1.6"/><ellipse cx="46" cy="330" rx="3" ry="2"/></g>
<ellipse cx="50" cy="388" rx="42" ry="8" fill="#000" opacity=".25"/>
<ellipse cx="50" cy="160" rx="34" ry="6" fill="#000" opacity=".2"/>
<!-- 뒤 아치 (작음) -->
<g class="o" fill="#7a5230"><rect x="20" y="118" width="8" height="46"/><rect x="72" y="118" width="8" height="46"/></g>
<path class="o" d="M20,120 Q20,84 50,82 Q80,84 80,120" fill="none" stroke-width="7"/>
<path d="M22,120 Q22,86 50,84 Q78,86 78,120" fill="none" stroke="#9c6e42" stroke-width="3.5"/>
<g fill="none" stroke="#4f7a2e" stroke-width="3"><path d="M22,112 q8,-14 20,-20 M78,112 q-8,-14 -20,-20"/></g>
<use href="#leaf" transform="translate(30,100) rotate(-40)"/><use href="#leaf" transform="translate(70,98) rotate(40)"/><use href="#leaf" transform="translate(50,86)"/>
<use href="#rose" transform="translate(36,92) scale(.8)"/><use href="#rose" transform="translate(64,92) scale(.8)"/><use href="#rose" transform="translate(50,84) scale(.7)"/>
<!-- 중간 격자 덩굴 (앞뒤 아치 사이) -->
<g stroke="#4f7a2e" stroke-width="3" fill="none" stroke-linecap="round"><path d="M24,170 q-4,60 0,120 M76,170 q4,60 0,120"/></g>
<use href="#leaf" transform="translate(22,210) rotate(-70)"/><use href="#leaf" transform="translate(78,240) rotate(70)"/><use href="#leaf" transform="translate(24,270) rotate(-60)"/>
<use href="#rose" transform="translate(24,235) scale(.75)"/><use href="#rose" transform="translate(76,205) scale(.75)"/><use href="#rose" transform="translate(77,275) scale(.75)"/>
<!-- 앞 아치 (큼) -->
<g class="o" fill="#7a5230"><rect x="10" y="300" width="11" height="88"/><rect x="79" y="300" width="11" height="88"/></g>
<path d="M13,304 v80 M82,304 v80" stroke="#9c6e42" stroke-width="3"/>
<path class="o" d="M10,304 Q10,236 50,232 Q90,236 90,304" fill="none" stroke-width="9"/>
<path d="M12,304 Q12,240 50,236 Q88,240 88,304" fill="none" stroke="#9c6e42" stroke-width="4.5"/>
<path d="M14,300 q0,-40 18,-52 M86,300 q0,-40 -18,-52" stroke="#5a3a20" stroke-width="1.5" fill="none"/>
<!-- 앞 아치 격자 -->
<g stroke="#5a3a20" stroke-width="2.5" fill="none"><path d="M18,290 l12,-16 M14,270 l14,-18 M82,290 l-12,-16 M86,270 l-14,-18"/></g>
<!-- 덩굴·잎·장미 (앞) -->
<g fill="none" stroke="#4f7a2e" stroke-width="4" stroke-linecap="round"><path d="M14,300 q-2,-50 22,-60 M86,300 q2,-50 -22,-60 M36,242 q14,-8 28,0"/></g>
<use href="#leaf" transform="translate(20,282) rotate(-50)"/><use href="#leaf" transform="translate(28,256) rotate(-30)"/><use href="#leaf" transform="translate(80,282) rotate(50)"/><use href="#leaf" transform="translate(72,256) rotate(30)"/><use href="#leaf" transform="translate(40,238) rotate(-10)"/><use href="#leaf" transform="translate(60,238) rotate(10)"/><use href="#leaf" transform="translate(50,230)"/>
<use href="#rose" transform="translate(16,296)"/><use href="#rose" transform="translate(24,266)"/><use href="#rose" transform="translate(84,296)"/><use href="#rose" transform="translate(76,266)"/><use href="#rose" transform="translate(34,246)"/><use href="#rose" transform="translate(66,246)"/><use href="#rose" transform="translate(50,236) scale(1.1)"/>
<!-- 떨어진 꽃잎 -->
<g fill="#e8636d" stroke="#7a1a22" stroke-width=".8"><ellipse cx="40" cy="372" rx="3" ry="1.8" transform="rotate(-20 40 372)"/><ellipse cx="62" cy="356" rx="3" ry="1.8" transform="rotate(30 62 356)"/><ellipse cx="54" cy="180" rx="2.5" ry="1.5"/></g>
</svg>
