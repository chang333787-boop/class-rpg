<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- 꽃밭 가장자리 e2 — 꽃밭 칸의 바깥 변에만 덧그린다(물가 shore_e 와 같은 자리). 풀이 5~24% 로 칸마다 한 굽이씩 느리게 물결치며 파고들고 잎 덩이가 경계에 걸친다. 양 끝 깊이 11 고정. 떨어진 꽃 색: 주소 뒤 #red #yellow #white #violet #orange #blue (기본 pink) -->
