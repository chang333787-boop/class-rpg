<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>수채화 따라하기</title>
<script>
/* 코스 로더: index.html 은 엔진, 콘텐츠는 course_<key>.js. ?course=drawing 처럼 고른다(기본 watercolor). */
var COURSE_KEY = ((new URLSearchParams(location.search).get('course') || 'watercolor').replace(/[^a-z]/g, '')) || 'watercolor';
document.write('<script src="course_' + COURSE_KEY + '.js?v=20260903"><\/script>');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<!-- 우리반 성장 RPG 연동: 학생 로그인·기록 동기화·작품 제출. 라이브러리가 없어도(오프라인·파일 직접 열기) 손님 모드로 동작 -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="../gamedata.js?v=20260730"></script>
<style>
  /* 디자인 톤: 영어 복습앱(Warm Paper v2)과 통일 — 종이색 배경, 흰 카드, 코랄 포인트, 세이지 완료, Jua 큰 제목 + Pretendard 본문 */
  :root { --paper:#f8f6f1; --paper-2:#f1ede4; --ink:#2a2420; --card:#fff; --line:rgba(60,45,30,.10); --line-2:rgba(60,45,30,.18);
    --accent:#d4704f; --accent-dk:#b85a3c; --ok:#5f9b74; --ok-dk:#4a7f5c; --warn:#c8962e; --tip:#fff7e3; --muted:#7a6f66; --wash:#fbe9e2;
    --sky:#4f8fbf; --sky-soft:#e6f0f8; --sh:0 1px 2px rgba(60,45,30,.06),0 3px 8px rgba(60,45,30,.05);
    --font-ui:'Jua','Pretendard Variable',Pretendard,'맑은 고딕','Malgun Gothic',sans-serif;
    --font-body:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'맑은 고딕','Malgun Gothic','Segoe UI',sans-serif;
    --font-hand:'Nanum Pen Script','Jua',cursive; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; }
  body { font-family:var(--font-body); background:var(--paper); color:var(--ink); font-size:19px; line-height:1.5; }
  .serif { font-family:var(--font-ui); font-weight:400; letter-spacing:-.01em; }
  .hand { font-family:var(--font-hand); color:var(--accent); font-size:22px; letter-spacing:.02em; line-height:1.1; }
  button { font-family:inherit; font-size:19px; font-weight:700; border:1.5px solid var(--line-2); border-radius:14px; padding:12px 20px; cursor:pointer; background:#fff; color:var(--ink); transition:transform .06s; }
  button:active { transform:translateY(1px); }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); box-shadow:0 3px 0 var(--accent-dk); }
  button.primary:active { box-shadow:0 1px 0 var(--accent-dk); }
  button.ok { background:var(--ok); color:#fff; border-color:var(--ok); box-shadow:0 3px 0 var(--ok-dk); }
  button.ok:active { box-shadow:0 1px 0 var(--ok-dk); }
  button.ghost { background:transparent; border-color:transparent; color:var(--muted); }
  button:disabled { opacity:.5; }
  .screen { display:none; min-height:100%; padding:16px; max-width:900px; margin:0 auto; }
  .screen.on { display:block; }

  /* ---- 홈 ---- */
  .top { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .top h1 { font-size:27px; margin:0; }
  .promise { background:var(--card); border:1px solid var(--line); border-radius:18px; box-shadow:var(--sh); padding:12px 16px; margin:0 0 14px; font-size:17px; display:flex; gap:18px; flex-wrap:wrap; align-items:center; }
  .promise b { font-family:var(--font-hand); font-weight:400; font-size:24px; color:var(--accent); line-height:1; }
  .lessons { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:14px; }
  .lesson { background:var(--card); border-radius:18px; padding:16px 18px; border:1px solid var(--line); box-shadow:var(--sh); cursor:pointer; position:relative; }
  .lesson h2 { font-size:21px; margin:6px 0 2px; }
  .lesson .tech { font-size:13px; color:var(--accent); font-weight:700; letter-spacing:.02em; }
  .lesson p { margin:4px 0 0; font-size:15px; color:var(--muted); }
  .lesson .done { position:absolute; top:12px; right:14px; font-size:14px; color:var(--ok); font-weight:700; }
  .lesson.bonus { border-style:dashed; }
  .part-hd { grid-column:1/-1; margin:18px 0 0; padding:0 2px; }
  .part-hd:first-child { margin-top:2px; }
  .part-hd h2 { font-family:var(--font-ui); font-weight:400; font-size:23px; margin:0; display:flex; align-items:center; gap:9px; letter-spacing:-.01em; }
  .dab { vertical-align:-5px; flex:none; }
  .part-hd .sub { font-size:14px; color:var(--muted); margin:2px 0 0; }
  .part-hd .grade { display:none; font-size:12px; color:#8a5a00; }
  body.teacher .part-hd .grade { display:inline; }

  /* ---- TV 수업 모드: 교사 PC를 TV에 미러링, 다 같이 같은 단계 ---- */
  body.tv .screen { max-width:1240px; }
  body.tv .reflect, body.tv .tip, body.tv .std { display:none !important; }
  body.tv .text { font-size:42px; }
  body.tv .sub { font-size:27px; }
  body.tv .step-no { font-size:20px; }
  body.tv .art { max-width: calc(54vh * 40 / 26); }
  body.tv .meter { font-size:24px; padding:10px 18px; }
  body.tv .meter b { font-size:28px; }
  body.tv .nav button { font-size:23px; padding:15px 28px; }
  body.tv .timer .t { font-size:58px; min-width:160px; }
  body.tv .compare h4 { font-size:26px; }
  body.tv .compare p { font-size:23px; }
  body.tv .checks label { font-size:27px; }
  body.tv .bar .title { font-size:26px; }
  body.tv .dots i { width:16px; height:16px; }
  body.tv .tv-hint { display:inline; }
  .tv-hint { display:none; font-size:14px; color:var(--muted); }
  .std { display:none; font-size:12px; color:#8a5a00; margin-top:6px; }
  body.teacher .std { display:block; }

  /* ---- 차시 화면 ---- */
  .bar { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .bar .title { font-weight:700; font-size:19px; flex:1; }
  .dots { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .dots i { width:11px; height:11px; border-radius:50%; background:var(--line-2); display:block; }
  .dots i.cur { background:var(--accent); transform:scale(1.3); }
  .dots i.done { background:var(--ok); }
  .card { background:var(--card); border-radius:18px; padding:18px; border:1px solid var(--line); box-shadow:var(--sh); }
  .art { background:var(--paper-2); border-radius:16px; overflow:hidden; aspect-ratio: 40/26; width:100%; max-width: calc(40vh * 40 / 26); margin:0 auto; position:relative; }
  .art svg { width:100%; height:100%; display:block; }
  .art video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none; }
  .art.showvid video { display:block; }
  .art .vidToggle { position:absolute; right:10px; bottom:10px; z-index:2; font-size:14px; padding:7px 14px; border-radius:999px; background:rgba(255,255,255,.96); border:1.5px solid var(--line-2); box-shadow:0 1px 3px rgba(0,0,0,.12); }
  body.tv .art .vidToggle { font-size:19px; padding:10px 18px; }
  .compare .art { max-width:none; }
  .meters { display:flex; gap:10px; flex-wrap:wrap; margin:12px 0 4px; }
  .quiz { display:flex; gap:10px; margin:10px 0 2px; flex-wrap:wrap; align-items:center; }
  .quiz button { display:flex; align-items:center; gap:8px; font-size:17px; padding:9px 16px; }
  .quiz button i { width:18px; height:18px; border-radius:50%; display:inline-block; }
  .quiz button.sel { border-color:var(--accent); background:var(--wash); }
  .quiz .qmsg { font-size:15px; color:var(--ok); font-weight:600; }
  .meter { background:var(--paper-2); border-radius:999px; padding:7px 15px; font-size:17px; font-weight:600; }
  .meter b { font-size:20px; letter-spacing:2px; }
  .step-no { font-size:15px; color:var(--muted); margin-top:8px; }
  .text { font-size:24px; font-weight:700; margin:4px 0; line-height:1.4; }
  .sub { font-size:18px; color:#444; margin:2px 0 6px; }
  .term { display:inline-block; font-size:14px; color:var(--accent); background:var(--wash); border:1px solid transparent; border-radius:999px; padding:2px 10px; margin-left:6px; vertical-align:middle; font-weight:700; }
  .tip { display:none; background:var(--tip); border-left:6px solid var(--warn); border-radius:12px; padding:11px 14px; margin-top:12px; font-size:16px; line-height:1.55; }
  body.teacher .tip { display:block; }
  .tip b { color:#8a5a00; }
  .nav { display:flex; gap:10px; margin-top:14px; align-items:center; flex-wrap:wrap; }
  .nav .spacer { flex:1; }
  .timer { display:flex; align-items:center; gap:16px; margin-top:12px; background:var(--sky-soft); border-radius:16px; padding:12px 16px; }
  .timer .t { font-size:38px; font-weight:800; font-variant-numeric:tabular-nums; min-width:110px; }
  .timer .msg { font-size:17px; color:#345; }
  .compare { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:10px; }
  .compare > div { border-radius:16px; padding:10px; border:2px solid var(--line-2); }
  .compare .good { border-color:var(--ok); background:#e4f2e9; }
  .compare .bad { border-color:var(--accent); background:var(--wash); }
  .compare h4 { margin:0 0 6px; font-size:18px; }
  .compare p { margin:6px 0 0; font-size:16px; }
  .chip { display:inline-block; background:#fff; border:1.5px solid var(--line-2); border-radius:999px; padding:4px 13px; font-size:15px; font-weight:600; color:var(--muted); margin:3px 4px 3px 0; }
  .finish { text-align:center; padding:24px 10px; }
  .finish .big { font-size:64px; }
  .finish .text { font-family:var(--font-ui); font-weight:400; font-size:30px; }
  .checks label { display:flex; gap:10px; align-items:center; font-size:19px; background:var(--paper-2); border-radius:14px; padding:11px; margin:8px 0; }
  .checks input { width:24px; height:24px; }
  .reflect { margin-top:14px; border-top:1px dashed var(--line); padding-top:12px; }
  .reflect .moods { display:flex; gap:8px; margin:6px 0; }
  .reflect .moods button { font-size:30px; padding:6px 14px; border:2px solid transparent; }
  .reflect .moods button.sel { border-color:var(--accent); background:var(--wash); }
  .reflect input { width:100%; font-size:17px; padding:11px 13px; border:2px solid var(--line-2); border-radius:12px; font-family:inherit; background:#fff; }
  .reflect .lbl { font-size:15px; color:var(--muted); }

  /* ---- 기록 ---- */
  .gal h3 { margin:18px 0 8px; font-size:18px; }
  .thumbs { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:10px; }
  .thumb { background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; cursor:pointer; box-shadow:var(--sh); }
  .thumb img { width:100%; aspect-ratio:1; object-fit:cover; display:block; }
  .thumb .cap { font-size:13px; padding:6px 8px; color:var(--muted); display:flex; justify-content:space-between; }
  .viewer { position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; align-items:center; justify-content:center; flex-direction:column; gap:12px; padding:16px; z-index:50; }
  .viewer.on { display:flex; }
  .viewer img { max-width:100%; max-height:70vh; border-radius:8px; }
  .viewer .info { color:#fff; font-size:16px; text-align:center; }
  .empty { color:var(--muted); font-size:16px; padding:20px; text-align:center; }
  @media (max-width:600px){ .text{font-size:21px;} .compare{grid-template-columns:1fr;} button{padding:11px 15px; font-size:17px;} }

  /* ---- SVG 애니메이션 ---- */
  .brush { animation: sweep 2.4s ease-in-out infinite; }
  @keyframes sweep { 0%{transform:translate(0,0)} 45%{transform:translate(150px,0)} 55%{transform:translate(150px,0)} 100%{transform:translate(0,0)} }
  .row { stroke-dasharray:300; stroke-dashoffset:300; animation: draw 4s linear infinite; }
  .row:nth-child(2){ animation-delay:1.3s } .row:nth-child(3){ animation-delay:2.6s }
  @keyframes draw { 0%{stroke-dashoffset:300} 30%{stroke-dashoffset:0} 100%{stroke-dashoffset:0} }
  .blob { transform-origin:center; animation: bloom 3s ease-out infinite; transform-box:fill-box; }
  .blob.b2 { animation-delay:1s } .blob.b3 { animation-delay:2s }
  @keyframes bloom { 0%{transform:scale(0.2); opacity:0} 20%{opacity:.9} 70%{transform:scale(1); opacity:.8} 100%{transform:scale(1); opacity:.8} }
  .drop { animation: fall 1.6s ease-in infinite; }
  @keyframes fall { 0%{transform:translateY(-30px); opacity:0} 30%{opacity:1} 100%{transform:translateY(0); opacity:1} }
  .tap { animation: tap 1.5s ease-in-out infinite; transform-box:fill-box; transform-origin:bottom; }
  @keyframes tap { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
  .fade-in { animation: fin 2s ease-out both; }
  @keyframes fin { 0%{opacity:0} 40%{opacity:1} 100%{opacity:1} }
  .tilt { animation: tilt 3s ease-in-out infinite; transform-origin:center; transform-box:fill-box; }
  @keyframes tilt { 0%,100%{transform:rotate(0)} 50%{transform:rotate(-8deg)} }
  @media (prefers-reduced-motion: reduce) { .brush,.row,.blob,.drop,.tap,.fade-in,.tilt { animation:none; stroke-dashoffset:0; opacity:1; } }
</style>
</head>
<body>

<!-- ============ 홈 ============ -->
<div class="screen on" id="home">
  <div class="top">
    <h1 class="serif"><span id="appTitle">수채화 따라하기</span> <svg width="46" height="16" viewBox="0 0 60 20" aria-hidden="true" style="vertical-align:-1px"><ellipse cx="10" cy="11" rx="9" ry="6" fill="#3f74c9" opacity=".5"/><ellipse cx="30" cy="9" rx="9" ry="6" fill="#e8a33d" opacity=".55"/><ellipse cx="50" cy="12" rx="9" ry="6" fill="#3f9d63" opacity=".5"/></svg> <span class="hand" id="appSub"></span></h1>
    <div><a class="ghost" id="courseLink" style="display:inline-block; text-decoration:none; padding:12px 14px; font-size:17px; color:var(--accent); font-weight:700"></a><button class="ghost" id="stuBtn"></button><button class="ghost" id="galBtn">내 기록</button><button class="ghost" id="tvBtn">TV 수업</button><button class="ghost" id="teacherBtn">선생님</button></div>
  </div>
  <div class="promise" id="promise"></div>
  <p style="margin:0 0 12px; color:var(--muted); font-size:16px"><span id="intro"></span> <span id="teacherHint" style="display:none; color:#8a5a00">선생님 모드: 각 단계 아래에 지도 포인트와 성취기준이 보입니다.</span></p>
  <div class="lessons" id="lessonList"></div>
  <p class="tip" id="printBox" style="margin-top:20px; font-size:15px"></p>
  <p style="margin-top:20px; font-size:14px; color:var(--muted)">진행 상황과 사진은 내 계정(또는 손님이면 이 태블릿)에 저장돼요. <button class="ghost" id="resetBtn" style="font-size:14px; padding:4px 8px">진행 초기화</button></p>
</div>

<!-- ============ 차시 ============ -->
<div class="screen" id="lessonScreen">
  <div class="bar">
    <button id="backBtn">홈</button>
    <div class="title" id="lessonTitle"></div>
    <span class="tv-hint">← → 키(리모컨)로 넘기기</span><button id="ttsBtn" title="읽어주기">🔊</button>
  </div>
  <div class="dots" id="dots"></div>
  <div id="stepBox"></div>
</div>

<!-- ============ 기록 ============ -->
<div class="screen gal" id="galScreen">
  <div class="bar"><button id="galBack">홈</button><div class="title">내 기록</div></div>
  <p style="font-size:15px; color:var(--muted); margin:0 0 6px">차시마다 남긴 작품 사진과 한 줄 생각이에요. 처음 것과 나중 것을 비교해 봐요.</p>
  <div id="galBody"></div>
</div>
<div class="viewer" id="viewer"><img id="viewerImg" alt="작품 사진"><div class="info" id="viewerInfo"></div><div><button id="viewerDel">삭제</button> <button class="primary" id="viewerClose">닫기</button></div></div>
<input type="file" id="photoIn" accept="image/*" capture="environment" hidden>
<div class="viewer" id="stuPick"><div style="background:#fff; border-radius:12px; padding:22px; max-width:520px; width:92%;">
  <div style="font-weight:700; font-size:20px; margin-bottom:4px">누구인가요?</div>
  <div id="stuHint" style="font-size:14px; color:var(--muted); margin-bottom:14px">우리반 성장 RPG와 같은 이름·비밀번호예요. 진행과 사진이 내 계정에 저장돼요.</div>
  <div id="stuGrid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(96px,1fr)); gap:8px"></div>
  <div id="stuPwRow" style="display:none; margin-top:12px; gap:8px; align-items:center">
    <input id="stuPw" type="password" inputmode="numeric" placeholder="비밀번호" style="flex:1; font-size:18px; padding:10px; border:1px solid var(--line); border-radius:10px; font-family:inherit">
    <button class="primary" id="stuGo">들어가기</button>
  </div>
  <div id="stuErr" style="color:var(--warn); font-size:14px; min-height:20px; margin-top:6px"></div>
  <div style="margin-top:10px; display:flex; gap:8px"><button id="stuNone" style="flex:1">손님으로 쓰기 (이 태블릿에만 저장)</button></div>
</div></div>

<script>
/* 콘텐츠(LESSONS·ART·PARTS)는 course_<key>.js 에 있음 — 아래 COURSE 로더 참고 */

/* ==================================================================
   SVG 그림
   ================================================================== */
/* 공통 필터: ptx=도화지 요철 질감, wc=물감 가장자리 번짐(변위). 애니메이션 요소는 필터 밖에 둘 것(성능). */

/* ===== 코스 데이터 ===== */
const COURSE = window.COURSE_DATA;
if (!COURSE){ document.body.innerHTML = '<p style="padding:24px; font-size:18px">코스 파일(course_' + COURSE_KEY + '.js)을 찾을 수 없어요. 주소의 course 값을 확인하세요.</p>'; throw new Error('no course'); }
const LESSONS = COURSE.lessons, PARTS = COURSE.parts, ART = COURSE.art || {}, NS = COURSE.ns || COURSE.key;
function renderArt(a){ const f = a && ART[a.type]; return f ? f(a) : '<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg"><rect x="20" y="20" width="360" height="220" rx="6" fill="#fdfcf7" stroke="#e4dfd2"/></svg>'; }
/* 시연 영상: videos/l{차시}s{단계}.mp4 파일이 있으면 "실제 영상 보기" 단추가 나타남.
   기본은 그림(도식 = 무엇을 하라), 영상은 눌러서 보는 실제 예시. 파일이 없으면 그림만. */
function stepVideo(lid, stepNo){ return `<video muted loop playsinline preload="metadata" src="${COURSE.videoDir || 'videos'}/l${lid}s${stepNo}.mp4"
  onloadeddata="var b=this.parentNode.querySelector('.vidToggle'); if(b) b.hidden=false;"
  onerror="var b=this.parentNode.querySelector('.vidToggle'); if(b) b.remove(); this.remove();"></video><button class="vidToggle" hidden
  onclick="var a=this.parentNode, v=a.querySelector('video'); a.classList.toggle('showvid'); if(a.classList.contains('showvid')){ v.play(); this.textContent='그림 보기'; } else { v.pause(); this.textContent='실제 영상 보기'; }">실제 영상 보기</button>`; }

/* ==================================================================
   저장 (진행·성찰: localStorage / 사진: IndexedDB)
   ================================================================== */
/* 번호별 기록: 공용 태블릿에서 학생마다 진행·성찰이 분리 저장됨. '0' = 번호 없음 */
/* ===== 우리반 성장 RPG 연동 =====
   - 로그인: RPG 학생 목록(DB.getStudents)에서 이름 선택 + 비밀번호(student.pw) — student.html의 doLogin과 같은 규칙
   - 기록: localStorage(빠름·오프라인) + Firebase 'classRPG_watercolor/<학생id>' (RPG 루트 classRPG_v3 밖의 별도 키 → 기존 데이터·정규화·백업에 영향 없음)
   - 작품: Storage artworks/ 업로드 후 students/<key>/pendingRewards 에 type:'artwork' 부분 저장(kiosk.js 와 같은 규칙) → 교사 승인 → RPG 작품 전시
   - firebase/gamedata 가 없으면(파일 직접 열기·오프라인) 손님 모드만 */
const RPG = { ready:false, error:null, students:[] };
async function rpgInit(){
  if (typeof firebase === 'undefined' || typeof DB === 'undefined'){ RPG.error = '라이브러리 없음'; return; }
  try {
    await Promise.race([DB.init(), new Promise((_, rej) => setTimeout(() => rej(new Error('서버 응답 없음')), 8000))]);
    RPG.students = (DB.getStudents() || []).filter(s => s && s.id && s.name);
    RPG.ready = RPG.students.length > 0;
  } catch(e){ RPG.error = e.message || String(e); }
}
const rpgOn = () => RPG.ready && !!student && student !== '0';
const wcRef = sid => firebase.database().ref('classRPG_' + COURSE.key + '/' + sid);
async function rpgStudentKey(sid){ /* kiosk.js getStudentStorageKey 와 같은 규칙: 실제 학생 노드 key(껍데기 방지) */
  const snap = await firebase.database().ref(DB.KEY + '/students').once('value'); const raw = snap.val() || {};
  if (raw[sid] && raw[sid].id === sid) return sid;
  const k = Object.keys(raw).find(k => raw[k] && raw[k].id === sid); return k || sid;
}
let rpgSyncTimer = null;
function rpgSync(){ if (!rpgOn()) return; clearTimeout(rpgSyncTimer);
  rpgSyncTimer = setTimeout(() => { wcRef(student).set({ name: studentName, progress, reflect, updatedAt: Date.now() }).catch(e => console.warn('[wc] 동기화 실패', e)); }, 800); }
async function rpgLoad(sid){ try { const snap = await wcRef(sid).once('value'); const d = snap.val();
  if (d){ localStorage.setItem(NS+'.progress.' + sid, JSON.stringify(d.progress || {})); localStorage.setItem(NS+'.reflect.' + sid, JSON.stringify(d.reflect || {})); } } catch(e){ console.warn('[wc] 불러오기 실패', e); } }
async function rpgSubmitArtwork(L, dataUrl){
  const blob = await (await fetch(dataUrl)).blob();
  const path = 'artworks/' + student + '_' + Date.now() + '.jpg';
  const ref = firebase.storage().ref(path); await ref.put(blob); const url = await ref.getDownloadURL();
  const fresh = DB.getStudent(student) || {}; const pending = Array.isArray(fresh.pendingRewards) ? fresh.pendingRewards.slice() : [];
  const why = (reflect[L.id] && reflect[L.id].why) || '';
  pending.push({ id:'art_' + Date.now(), type:'artwork', label:'🎨 "' + COURSE.short + ' ' + L.id + '. ' + L.title + '" 작품 제출',
    artTitle: COURSE.short + ' ' + L.id + '. ' + L.title, artDesc: why || ('기법: ' + L.tech), artUrl:url, subject:'미술', exp:30, gold:20, icon:'🎨', date: Utils.todayStr() });
  const key = await rpgStudentKey(student);
  await firebase.database().ref(DB.KEY + '/students/' + key + '/pendingRewards').set(pending);
}

let student = localStorage.getItem('wc.student'), studentName = localStorage.getItem('wc.studentName') || '';
if (student && student !== '0') student = null; /* RPG 학생은 열 때마다 로그인(공용 태블릿) — 손님('0')만 유지 */
let progress = {}, reflect = {};
const pKey = () => NS+'.progress.' + (student || '0');
const rKey = () => NS+'.reflect.' + (student || '0');
try { if (localStorage.getItem(NS+'.progress') !== null) { /* 번호 기능 이전 기록을 '번호 없음'으로 이어받기 */
  if (localStorage.getItem(NS+'.progress.0') === null) { localStorage.setItem(NS+'.progress.0', localStorage.getItem(NS+'.progress')); localStorage.setItem(NS+'.reflect.0', localStorage.getItem(NS+'.reflect') || '{}'); }
  localStorage.removeItem(NS+'.progress'); localStorage.removeItem(NS+'.reflect'); } } catch(e){}
function loadRecords(){ progress = {}; reflect = {}; try { progress = JSON.parse(localStorage.getItem(pKey())||'{}'); reflect = JSON.parse(localStorage.getItem(rKey())||'{}'); } catch(e){} }
loadRecords();
let teacher = localStorage.getItem('wc.teacher') === '1';
const saveProgress = () => { localStorage.setItem(pKey(), JSON.stringify(progress)); rpgSync(); };
const saveReflect = () => { localStorage.setItem(rKey(), JSON.stringify(reflect)); rpgSync(); };
const db = {
  open(){ return new Promise((res, rej) => { const r = indexedDB.open('wc', 1); r.onupgradeneeded = () => r.result.createObjectStore('photos', {keyPath:'id', autoIncrement:true}); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async add(p){ const d = await this.open(); return new Promise((res, rej) => { const t = d.transaction('photos','readwrite'); const r = t.objectStore('photos').add(p); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async all(){ const d = await this.open(); return new Promise((res, rej) => { const r = d.transaction('photos').objectStore('photos').getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async del(id){ const d = await this.open(); return new Promise((res, rej) => { const r = d.transaction('photos','readwrite').objectStore('photos').delete(id); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); },
};
function shrink(file, max=1000){ return new Promise((res, rej) => { const img = new Image(); const u = URL.createObjectURL(file);
  img.onload = () => { const s = Math.min(1, max/Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', .85)); };
  img.onerror = rej; img.src = u; }); }

const $ = id => document.getElementById(id);

/* 물감 자국(dab): 이 앱의 시각 포인트. 챕터마다 고유 색 */
const DAB = (c, w) => { const width = w || 34; return `<svg class="dab" width="${width}" height="${Math.round(width*0.6)}" viewBox="0 0 40 24" aria-hidden="true"><path d="M4 14 C2 6 10 2 20 3 C31 2 38 6 37 12 C38 19 30 22 19 21 C10 23 5 20 4 14Z" fill="${c}" opacity=".5"/><path d="M9 13 C8 8 14 5 21 6 C29 5 34 8 33 12 C34 16 28 19 20 18 C13 19 10 17 9 13Z" fill="${c}" opacity=".45"/></svg>`; };

function renderHome(){
  $('lessonList').innerHTML = PARTS.map(P => `<div class="part-hd"><h2>${DAB(P.color, 40)}${P.title}</h2><p class="sub">${P.sub} <span class="grade">· ${P.grade}</span></p></div>`
    + LESSONS.filter(L => L.part === P.id).map(L => `<div class="lesson ${L.bonus?'bonus':''}" data-id="${L.id}">
    <div class="tech" style="color:${P.color}">${L.tech}</div><h2>${L.id}. ${L.title}</h2><p>${L.goal}</p><div class="std">${L.std}</div>
    ${progress[L.id]==='done' ? '<div class="done">✔ 완료</div>' : (progress[L.id]>0 ? `<div class="done" style="color:var(--accent)">${progress[L.id]}/${L.steps.length}</div>` : '')}</div>`).join('')).join('');
  document.querySelectorAll('.lesson').forEach(el => el.onclick = () => openLesson(+el.dataset.id));
}
function openLesson(id){ const L = LESSONS.find(l=>l.id===id); cur = { lesson:L, step: -1 }; show('lessonScreen'); renderStep(); }
$('backBtn').onclick = () => { stopTimer(); speechSynthesis.cancel(); renderHome(); show('home'); };

function renderStep(){
  stopTimer(); speechSynthesis.cancel();
  const L = cur.lesson, n = L.steps.length, i = cur.step;
  $('lessonTitle').textContent = `${L.id}. ${L.title}`;
  $('dots').innerHTML = Array.from({length:n+2},(_,k) => `<i class="${k-1===i?'cur':(k-1<i?'done':'')}"></i>`).join('');
  let html = '';
  if (i === -1){
    html = `<div class="card"><div class="art">${renderArt(L.steps[0].art)}</div>
      <div class="step-no">오늘의 목표 <span class="term">${L.tech}</span></div><div class="text">${L.goal}</div>
      <div class="sub" style="margin-top:8px">준비물</div><div>${L.materials.map(m=>`<span class="chip">${m}</span>`).join('')}</div>
      <div class="tip"><b>선생님 포인트</b> · 성취기준 ${L.std}. 이 차시는 ${n}단계이며, 한 단계씩 "다 했어요"를 누르며 진행합니다. 기다리는 단계에는 타이머가 있습니다. 한 번에 한 기법만 시범 → 5~10분 연습이 기본 흐름입니다.</div>
      <div class="nav"><div class="spacer"></div><button class="primary" id="nextBtn">시작해요 ▶</button></div></div>`;
  } else if (i < n){
    const s = L.steps[i];
    html = `<div class="card"><div class="art">${renderArt(s.art)}${stepVideo(L.id, i+1)}</div>
      <div class="meters">${(COURSE.meters || []).map(m => meter(s[m.key], m.icon, m.labels)).join('')}</div>
      <div class="step-no">${i+1} / ${n} 단계</div><div class="text">${s.text}</div>${s.sub?`<div class="sub">${s.sub}</div>`:''}
      ${s.quiz?`<div class="quiz" id="quizBox">${s.quiz.options.map((o,k)=>`<button data-k="${k}"><i style="background:${o[1]}"></i>${o[0]}</button>`).join('')}<span class="qmsg" id="qMsg"></span></div>`:''}
      ${s.wait?`<div class="timer"><div class="t" id="tDisp">${fmt(s.wait)}</div><div><button class="primary" id="tBtn">타이머 시작</button><div class="msg">${COURSE.waitMsg || '기다리는 동안 붓을 씻어요'}</div></div></div>`:''}
      ${s.tip?`<div class="tip"><b>선생님 포인트</b> · ${s.tip}</div>`:''}
      <div class="nav"><button id="prevBtn">◀ 이전</button><div class="spacer"></div><button class="ok" id="nextBtn">다 했어요 ▶</button></div></div>`;
  } else if (i === n){
    const c = L.check, r = reflect[L.id] || {};
    html = `<div class="card"><div class="step-no">확인해 봐요</div><div class="text">${c.q}</div>`;
    if (c.items) html += `<div class="checks">${c.items.map((t,k)=>`<label><input type="checkbox" data-k="${k}"> ${t}</label>`).join('')}</div>`;
    else html += `<div class="compare"><div class="good"><h4>잘 됐어요</h4><div class="art">${renderArt(c.good.art)}</div><p>${c.good.text}</p></div><div class="bad"><h4>다시 해 봐요</h4><div class="art">${renderArt(c.bad.art)}</div><p>${c.bad.text}</p></div></div>`;
    html += `<div class="reflect"><div class="lbl">오늘 내 그림은 어땠나요?</div>
      <div class="moods">${['😊','😐','🙁'].map(m=>`<button data-m="${m}" class="${r.mood===m?'sel':''}">${m}</button>`).join('')}</div>
      <input id="whyIn" placeholder="왜냐하면…" value="${(r.why||'').replace(/"/g,'&quot;')}">
      <div class="lbl" style="margin-top:8px">작품 사진을 남겨 두면 나중에 비교할 수 있어요.</div>
      <div class="nav" style="margin-top:6px"><button id="photoBtn">작품 사진 남기기</button><span id="photoMsg" class="lbl"></span></div></div>
      ${c.tip?`<div class="tip"><b>선생님 포인트</b> · ${c.tip} 이모티콘과 한 줄 이유는 점수가 아니라 성찰 기록입니다(과정중심평가).</div>`:''}
      <div class="nav"><button id="prevBtn">◀ 이전</button><div class="spacer"></div>${c.items?'':'<button id="retryBtn">다시 해볼래요</button>'}<button class="ok" id="nextBtn">완료 ▶</button></div></div>`;
  } else {
    html = `<div class="card finish"><div class="text">${L.title} 완료</div><div class="sub">오늘 익힌 기법: <span class="term">${L.tech}</span></div>
      <div class="nav" style="justify-content:center"><button id="homeBtn">처음으로</button><button id="galBtn2">내 기록</button>${LESSONS[L.id+1]?`<button class="primary" id="nextLessonBtn">다음: ${LESSONS[L.id+1].title} ▶</button>`:''}</div></div>`;
    if (!tv){ progress[L.id] = 'done'; saveProgress(); }
  }
  $('stepBox').innerHTML = html;
  if (!tv && i >= 0 && i < n && progress[L.id] !== 'done'){ progress[L.id] = Math.max(progress[L.id]||0, i); saveProgress(); }
  const q = id => $(id);
  if (q('nextBtn')) q('nextBtn').onclick = () => { if (i === n) saveWhy(); cur.step++; renderStep(); };
  if (q('prevBtn')) q('prevBtn').onclick = () => { if (i === n) saveWhy(); cur.step--; renderStep(); };
  if (q('retryBtn')) q('retryBtn').onclick = () => { cur.step = 0; renderStep(); };
  if (q('homeBtn')) q('homeBtn').onclick = () => $('backBtn').click();
  if (q('galBtn2')) q('galBtn2').onclick = () => openGallery();
  if (q('nextLessonBtn')) q('nextLessonBtn').onclick = () => openLesson(L.id+1);
  if (q('tBtn')) q('tBtn').onclick = () => startTimer(L.steps[i].wait);
  if (i >= 0 && i < n && L.steps[i].quiz){ const s = L.steps[i];
    document.querySelectorAll('#quizBox button').forEach(b => b.onclick = () => {
      document.querySelectorAll('#quizBox button').forEach(x => x.classList.remove('sel')); b.classList.add('sel');
      if (+b.dataset.k === s.quiz.answer){
        $('qMsg').textContent = '정답! 이제 진짜로 섞어서 확인해요.';
        const artEl = document.querySelector('.art'), sv = artEl && artEl.querySelector('svg');
        const revealed = Object.assign({}, s.art); delete revealed.hide;
        if (sv) sv.outerHTML = renderArt(revealed);
      } else { $('qMsg').textContent = '과연 그럴까요? 다른 색을 골라 보거나, 직접 섞어 확인해요.'; }
    }); }
  if (q('photoBtn')) q('photoBtn').onclick = () => { pendingPhotoLesson = L.id; $('photoIn').value = ''; $('photoIn').click(); };
  document.querySelectorAll('.moods button').forEach(b => b.onclick = () => { reflect[L.id] = Object.assign(reflect[L.id]||{}, {mood:b.dataset.m, ts:Date.now()}); saveReflect(); document.querySelectorAll('.moods button').forEach(x => x.classList.toggle('sel', x===b)); });
  function saveWhy(){ const w = q('whyIn'); if (w){ reflect[L.id] = Object.assign(reflect[L.id]||{}, {why:w.value.trim()}); saveReflect(); } }
}
$('photoIn').onchange = async e => {
  const f = e.target.files[0]; if (!f || pendingPhotoLesson === null) return;
  const msg = $('photoMsg'); if (msg) msg.textContent = '저장 중…';
  try { const data = await shrink(f); await db.add({lesson: pendingPhotoLesson, student: student||'0', course: COURSE.key, ts: Date.now(), data}); if (msg) msg.textContent = '저장했어요 ✔ (내 기록에서 볼 수 있어요)';
    if (rpgOn()){ if (msg) msg.textContent = 'RPG에 작품 보내는 중…'; const L = LESSONS.find(l => l.id === pendingPhotoLesson);
      try { await rpgSubmitArtwork(L, data); if (msg) msg.textContent = '저장했어요 ✔ 선생님 확인 후 RPG 작품에 전시돼요'; }
      catch(err){ console.error(err); if (msg) msg.textContent = '이 태블릿에는 저장됐지만 RPG 제출은 실패했어요: ' + err.message; } } }
  catch(err){ console.error(err); if (msg) msg.textContent = '저장 실패: ' + err.message; }
};

function startTimer(sec){
  stopTimer(); let left = sec; const d = $('tDisp'), b = $('tBtn'); b.disabled = true; b.textContent = '⏳ 기다리는 중';
  timerId = setInterval(() => { left--; d.textContent = fmt(left); if (left <= 0){ stopTimer(); d.textContent = '다 말랐어요!'; b.textContent = '✔ 끝'; beep(); } }, 1000);
}
function stopTimer(){ if (timerId){ clearInterval(timerId); timerId = null; } }
function beep(){ try { const ac = new (window.AudioContext||window.webkitAudioContext)(); [0,0.25,0.5].forEach(t => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ac.destination); g.gain.setValueAtTime(0.2, ac.currentTime+t); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+t+0.2); o.start(ac.currentTime+t); o.stop(ac.currentTime+t+0.2); }); } catch(e){} }

/* ---- 기록 화면 ---- */
async function openGallery(){
  show('galScreen'); const body = $('galBody'); body.innerHTML = '<div class="empty">불러오는 중…</div>';
  let photos = []; try { photos = await db.all(); } catch(e){ body.innerHTML = `<div class="empty">사진을 불러올 수 없어요: ${e.message}</div>`; return; }
  const mine = p => String(p.student == null ? '0' : p.student) === (student || '0') && (p.course || 'watercolor') === COURSE.key;
  const groups = LESSONS.map(L => ({L, ps: photos.filter(p => p.lesson === L.id && mine(p)).sort((a,b)=>a.ts-b.ts), r: reflect[L.id]})).filter(g => g.ps.length || (g.r && (g.r.mood || g.r.why)));
  if (!groups.length){ body.innerHTML = '<div class="empty">아직 기록이 없어요. 차시를 마칠 때 작품 사진을 남겨 보세요.</div>'; return; }
  body.innerHTML = groups.map(g => `<h3>${g.L.id}. ${g.L.title}${g.r&&g.r.mood?`<span style="font-size:22px">${g.r.mood}</span>`:''}${g.r&&g.r.why?`<span class="lbl" style="font-weight:400; font-size:15px; color:var(--muted)"> — ${g.r.why}</span>`:''}</h3>
    <div class="thumbs">${g.ps.map(p => `<div class="thumb" data-id="${p.id}"><img src="${p.data}" alt=""><div class="cap"><span>${dateStr(p.ts)}</span></div></div>`).join('') || '<div class="empty" style="padding:6px">사진 없음</div>'}</div>`).join('');
  body.querySelectorAll('.thumb').forEach(t => t.onclick = () => { const p = photos.find(x => x.id === +t.dataset.id); const L = LESSONS.find(l => l.id === p.lesson); $('viewerImg').src = p.data; $('viewerInfo').textContent = `${L.id}. ${L.title} · ${dateStr(p.ts)}`; $('viewer').classList.add('on'); $('viewerDel').onclick = async () => { if (confirm('이 사진을 지울까요?')) { await db.del(p.id); $('viewer').classList.remove('on'); openGallery(); } }; });
}
$('galBtn').onclick = openGallery; $('galBack').onclick = () => { renderHome(); show('home'); };
$('viewerClose').onclick = () => $('viewer').classList.remove('on');

/* ---- 읽어주기 ---- */
$('ttsBtn').onclick = () => {
  const t = [...$('stepBox').querySelectorAll('.text, .sub, .checks label, .compare p')].map(e => e.textContent.trim()).join('. ');
  if (!t || !window.speechSynthesis) return;
  speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'ko-KR'; u.rate = 0.95;
  const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('ko')); if (v) u.voice = v; speechSynthesis.speak(u);
};

(function applyCourse(){
  document.title = COURSE.title; $('appTitle').textContent = COURSE.title; $('appSub').textContent = COURSE.subtitle || '';
  $('promise').innerHTML = '<span><b>오늘의 약속</b></span>' + (COURSE.promise || []).map((p, i) => '<span>' + ['①','②','③','④'][i] + ' ' + p + '</span>').join('');
  $('intro').textContent = COURSE.intro || '';
  const pb = $('printBox'); const links = (COURSE.prints || []).map(p => '<a href="' + p.href + '" target="_blank" rel="noopener" style="color:var(--accent)">' + p.label + '</a>').join(' · ');
  pb.innerHTML = (links ? '<b>선생님용 인쇄물</b> · ' + links : '') + (COURSE.videoNote ? (links ? ' · ' : '') + COURSE.videoNote : ''); if (!pb.innerHTML) pb.remove();
  const other = COURSE.key === 'watercolor' ? {key:'drawing', label:'✏️ 데생 코스'} : {key:'watercolor', label:'🎨 수채화 코스'};
  const u = new URL(location.href); u.searchParams.set('course', other.key); $('courseLink').href = u.toString(); $('courseLink').textContent = other.label;
})();
setTeacher(teacher); setTv(tv); updateStuBtn(); renderHome();
if (!tv) rpgInit().then(() => { updateStuBtn(); if (student === null) openStuPick(); });
</script>
