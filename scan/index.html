<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>학습지 스캔</title>
<!-- [SCAN-1] 학습지 스캔 시험 페이지 — 찍기 → 테두리 확인 → 올리기. 외부 글꼴·CDN 없음(학교망).
     RPG 안에서는 iframe 모달로 열고, 결과 JPEG는 부모 창에 postMessage로 넘긴다(업로드는 부모의 기존 작품 올리기 경로).
     이 페이지는 Firebase를 모른다 → 운영 쓰기 0. -->
<style>
  :root { --paper:#f8f6f1; --ink:#2a2420; --card:#fff; --line:rgba(60,45,30,.14); --accent:#d4704f; --ok:#5f9b74; --muted:#6f655c; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; }
  body { font-family:'맑은 고딕','Malgun Gothic',system-ui,-apple-system,sans-serif; background:var(--paper); color:var(--ink); font-size:18px; line-height:1.5; }
  .wrap { max-width:720px; margin:0 auto; padding:14px 16px 28px; }
  h1 { font-size:22px; margin:4px 0 2px; }
  .steps { display:flex; gap:6px; margin:8px 0 14px; }
  .steps span { flex:1; text-align:center; font-size:15px; padding:6px 4px; border-radius:10px; background:#ece6dc; color:var(--muted); }
  .steps span.on { background:var(--accent); color:#fff; font-weight:700; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; }
  .tip { font-size:17px; color:var(--muted); margin:0 0 12px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:52px; padding:10px 18px; border-radius:14px; border:none;
         font:inherit; font-weight:700; font-size:19px; cursor:pointer; }
  .btn.main { background:var(--accent); color:#fff; } .btn.ok { background:var(--ok); color:#fff; } .btn.sub { background:#ece6dc; color:var(--ink); }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; } .row .btn { flex:1; min-width:140px; }
  .big { width:100%; min-height:120px; font-size:24px; }
  #stage { position:relative; margin:0 auto; touch-action:none; user-select:none; }
  #stage canvas { display:block; width:100%; height:100%; border-radius:10px; }
  #quad { position:absolute; inset:0; pointer-events:none; }
  .handle { position:absolute; width:48px; height:48px; margin:-24px 0 0 -24px; border-radius:50%; border:4px solid #fff; background:rgba(95,155,116,.85);
            box-shadow:0 2px 6px rgba(0,0,0,.35); touch-action:none; cursor:grab; }
  .handle:active { cursor:grabbing; }
  #loupe { position:absolute; width:110px; height:110px; border-radius:50%; border:3px solid #fff; box-shadow:0 2px 8px rgba(0,0,0,.4); pointer-events:none; display:none; overflow:hidden; background:#000; }
  #loupe canvas { width:100%; height:100%; }
  .seg { display:flex; gap:6px; margin-top:12px; } .seg button { flex:1; min-height:44px; border-radius:12px; border:2px solid var(--line); background:#fff; font:inherit; font-size:16px; cursor:pointer; }
  .seg button.on { border-color:var(--accent); background:#fbe9e2; font-weight:700; }
  #result { width:100%; border-radius:8px; border:1px solid var(--line); background:#fff; display:block; }
  .meta { font-size:14px; color:var(--muted); margin-top:8px; }
  .busy { text-align:center; padding:40px 0; font-size:20px; color:var(--muted); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📄 학습지 스캔</h1>
  <div class="steps"><span id="s1" class="on">① 찍기</span><span id="s2">② 테두리 확인</span><span id="s3">③ 올리기</span></div>

  <!-- ① 찍기 -->
  <section id="step1" class="card">
    <p class="tip">학습지를 <b>책상에 반듯하게 두고</b>, 위에서 <b>종이가 다 보이게</b> 찍어요.</p>
    <label class="btn main big" for="file">📷 학습지 찍기</label>
    <input id="file" type="file" accept="image/*" capture="environment" hidden>
    <div class="row"><label class="btn sub" for="file2">🖼️ 사진 고르기</label><input id="file2" type="file" accept="image/*" hidden></div>
  </section>

  <!-- ② 테두리 확인 -->
  <section id="step2" class="card" hidden>
    <p class="tip" id="tip2">초록 선이 <b>종이 가장자리</b>에 맞나요? 안 맞으면 <b>동그라미를 끌어</b> 모서리에 놓아요.</p>
    <div id="stage"><canvas id="photo"></canvas><svg id="quad"></svg><div id="loupe"><canvas id="loupeC" width="110" height="110"></canvas></div></div>
    <div class="seg" role="group" aria-label="스캔 색">
      <button data-mode="color" class="on">컬러(색연필·형광펜)</button><button data-mode="gray">흑백(글씨 선명)</button><button data-mode="none">보정만</button>
    </div>
    <div class="row">
      <button class="btn sub" id="retake">다시 찍기</button>
      <button class="btn sub" id="redetect">테두리 다시 찾기</button>
      <button class="btn ok" id="doScan">이대로 스캔 ▶</button>
    </div>
  </section>

  <!-- 처리 중 -->
  <section id="busy" class="card busy" hidden>종이를 반듯하게 펴는 중…</section>

  <!-- ③ 올리기 -->
  <section id="step3" class="card" hidden>
    <img id="result" alt="스캔한 학습지">
    <div class="meta" id="meta"></div>
    <div class="row">
      <button class="btn sub" id="back">테두리 다시 맞추기</button>
      <button class="btn ok" id="send">올리기 ✔</button>
    </div>
    <p class="meta" id="sendNote"></p>
  </section>
</div>

<script src="scan.js?v=20260917sta"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  let prep = null, corners = null, mode = 'color', last = null;   // 기본 컬러(판정: 색연필·형광펜 학습지가 많다)
  const show = n => { ['step1', 'step2', 'step3', 'busy'].forEach(s => $(s).hidden = s !== n);
    [1, 2, 3].forEach(i => $('s' + i).classList.toggle('on', n === 'step' + i || (n === 'busy' && i === 2))); };

  async function onFile(f) {
    if (!f) return;
    show('busy'); $('busy').textContent = '사진에서 종이를 찾는 중…';
    try { prep = await Scan.prepare(f); } catch (e) { alert('사진을 읽지 못했어요. 다른 사진을 골라 주세요.'); show('step1'); return; }
    corners = prep.detect.corners.map(p => p.slice());
    $('tip2').innerHTML = prep.detect.ok
      ? '초록 선이 <b>종이 가장자리</b>에 맞나요? 안 맞으면 <b>동그라미를 끌어</b> 모서리에 놓아요.'
      : '종이를 자동으로 못 찾았어요. <b>동그라미 네 개를 끌어</b> 종이 모서리에 놓아 주세요.';
    drawPhoto(); show('step2'); layout();
  }
  $('file').onchange = e => onFile(e.target.files[0]);
  $('file2').onchange = e => onFile(e.target.files[0]);

  // ── 사진 + 손잡이 ──
  function drawPhoto() {
    const s = prep.small.data, c = $('photo');
    c.width = s.width; c.height = s.height; c.getContext('2d').putImageData(s, 0, 0);
  }
  function layout() {
    const s = prep.small.data, st = $('stage');
    const maxW = st.parentElement.clientWidth - 0, maxH = Math.max(260, window.innerHeight - 330);
    const k = Math.min(maxW / s.width, maxH / s.height);
    st.style.width = Math.round(s.width * k) + 'px'; st.style.height = Math.round(s.height * k) + 'px';
    st.dataset.k = k; drawQuad();
  }
  window.addEventListener('resize', () => { if (prep && !$('step2').hidden) layout(); });
  function drawQuad() {
    const k = +$('stage').dataset.k, svg = $('quad');
    const pts = corners.map(([x, y]) => [x * k, y * k]);
    svg.setAttribute('viewBox', `0 0 ${$('stage').clientWidth} ${$('stage').clientHeight}`);
    svg.innerHTML = `<polygon points="${pts.map(p => p.join(',')).join(' ')}" fill="rgba(95,155,116,.18)" stroke="#5f9b74" stroke-width="4"/>`;
    $('stage').querySelectorAll('.handle').forEach(h => h.remove());
    pts.forEach(([x, y], i) => {
      const h = document.createElement('div'); h.className = 'handle'; h.style.left = x + 'px'; h.style.top = y + 'px';
      h.setAttribute('aria-label', ['왼쪽 위', '오른쪽 위', '오른쪽 아래', '왼쪽 아래'][i] + ' 모서리');
      h.addEventListener('pointerdown', ev => startDrag(ev, i));
      $('stage').appendChild(h);
    });
  }
  function startDrag(ev, i) {
    ev.preventDefault(); const st = $('stage'), k = +st.dataset.k, r = st.getBoundingClientRect();
    ev.target.setPointerCapture(ev.pointerId);
    const move = e => {
      const x = Math.max(0, Math.min(r.width, e.clientX - r.left)), y = Math.max(0, Math.min(r.height, e.clientY - r.top));
      corners[i] = [x / k, y / k]; drawQuad(); loupe(x, y);
      st.querySelectorAll('.handle')[i].setPointerCapture?.(e.pointerId);
    };
    const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); $('loupe').style.display = 'none'; drawQuad(); };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
  }
  // 손가락에 가려지는 모서리를 돋보기로 보여 준다(손가락 위쪽에)
  function loupe(x, y) {
    const L = $('loupe'), k = +$('stage').dataset.k, g = $('loupeC').getContext('2d'), src = $('photo');
    L.style.display = 'block'; L.style.left = (x - 55) + 'px'; L.style.top = (y - 150 < 0 ? y + 40 : y - 150) + 'px';
    const zoom = 3, sx = x / k - 55 / zoom / k * 1, sy = y / k - 55 / zoom / k * 1;
    g.fillStyle = '#000'; g.fillRect(0, 0, 110, 110);
    g.drawImage(src, sx, sy, 110 / zoom / k, 110 / zoom / k, 0, 0, 110, 110);
    g.strokeStyle = '#5f9b74'; g.lineWidth = 2; g.beginPath(); g.moveTo(55, 40); g.lineTo(55, 70); g.moveTo(40, 55); g.lineTo(70, 55); g.stroke();
  }

  document.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
    mode = b.dataset.mode; document.querySelectorAll('.seg button').forEach(x => x.classList.toggle('on', x === b));
  });
  $('retake').onclick = () => { $('file').value = ''; $('file2').value = ''; show('step1'); };
  $('redetect').onclick = () => { corners = prep.detect.corners.map(p => p.slice()); drawQuad(); };
  $('back').onclick = () => { show('step2'); layout(); };

  $('doScan').onclick = async () => {
    show('busy'); $('busy').textContent = '종이를 반듯하게 펴는 중…';
    await new Promise(r => setTimeout(r, 30));   // 안내 글자가 먼저 그려지게
    last = await Scan.finish(prep, corners, mode);
    $('result').src = last.url;
    $('meta').textContent = `${last.width}×${last.height} · ${Math.round(last.blob.size / 1024)}KB · ${last.ms.total}ms`;
    $('sendNote').textContent = '';
    show('step3');
  };
  // 올리기 — RPG 안(iframe)이면 부모에게 넘긴다. 시험 페이지 단독이면 올리지 않는다.
  $('send').onclick = () => {
    if (!last) return;
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'scan-result', blob: last.blob, width: last.width, height: last.height }, location.origin);
      $('sendNote').textContent = '보냈어요! 제목을 쓰고 제출하면 선생님께 가요.';
    } else {
      $('sendNote').textContent = '시험 페이지라서 여기서는 올리지 않아요. (RPG 안에서 열면 작품 올리기로 이어져요)';
    }
  };

  // 시험용: 사진 URL 목록을 자동으로 돌려 모서리·시간·크기를 돌려준다(하네스). 운영 쓰기 없음.
  window.__scanTest = async (urls, opt = {}) => {
    const out = [];
    for (const u of urls) {
      const blob = await (await fetch(u)).blob();
      const p = await Scan.prepare(blob);
      const r = await Scan.finish(p, p.detect.corners, opt.mode || 'color');
      out.push({ url: u, ok: p.detect.ok, mode: p.detect.mode, score: +p.detect.score.toFixed(2), corners: p.detect.corners.map(q => q.map(v => Math.round(v))),
        smallW: p.small.data.width, detectMs: p.ms, ...r.ms, kb: Math.round(r.blob.size / 1024), size: r.width + 'x' + r.height, quality: r.quality, resultUrl: r.url });
    }
    return out;
  };
})();
</script>
</body>
</html>
